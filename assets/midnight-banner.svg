<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Evangel Yoshiya G. Aranas — developer profile banner</title>
  <desc id="desc">A midnight-blue banner with a soft horizon glow, subtle stars, and the words learner, builder, developer.</desc>
  <defs>
    <linearGradient id="bg" x1="58" y1="16" x2="1135" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B12"/>
      <stop offset="0.48" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#0A1523"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(858 332) rotate(-90) scale(236 456)">
      <stop stop-color="#58A6FF" stop-opacity="0.3"/>
      <stop offset="0.48" stop-color="#1F6FEB" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="94" y1="0" x2="1096" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58A6FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#58A6FF" stop-opacity="0.22"/>
      <stop offset="0.75" stop-color="#7EE787" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>

    <g fill="#8C959F">
      <circle cx="80" cy="66" r="1" opacity="0.35"/>
      <circle cx="156" cy="118" r="1.4" opacity="0.2"/>
      <circle cx="246" cy="53" r="1" opacity="0.5"/>
      <circle cx="345" cy="96" r="1.2" opacity="0.25"/>
      <circle cx="450" cy="47" r="1" opacity="0.3"/>
      <circle cx="549" cy="86" r="1.5" opacity="0.2"/>
      <circle cx="660" cy="44" r="1" opacity="0.45"/>
      <circle cx="760" cy="112" r="1.2" opacity="0.3"/>
      <circle cx="873" cy="61" r="1" opacity="0.55"/>
      <circle cx="978" cy="103" r="1.4" opacity="0.2"/>
      <circle cx="1090" cy="55" r="1" opacity="0.4"/>
      <circle cx="1142" cy="142" r="1" opacity="0.28"/>
      <circle cx="1029" cy="190" r="1" opacity="0.35"/>
      <circle cx="723" cy="188" r="1" opacity="0.22"/>
      <circle cx="498" cy="180" r="1" opacity="0.2"/>
      <circle cx="302" cy="211" r="1" opacity="0.25"/>
      <circle cx="109" cy="226" r="1.4" opacity="0.2"/>
    </g>

    <circle cx="938" cy="247" r="86" fill="#58A6FF" opacity="0.07" filter="url(#blur)"/>
    <path d="M0 318C193 291 313 334 491 310C668 286 830 262 1200 307V360H0V318Z" fill="#07101C" opacity="0.8"/>
    <path d="M0 332C196 307 350 349 530 324C734 296 926 295 1200 327" stroke="url(#line)" stroke-width="1.5"/>

    <g transform="translate(96 82)">
      <text x="0" y="20" fill="#58A6FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="3">HELLO, WORLD — I'M</text>
      <text x="0" y="88" fill="#F0F6FC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="52" font-weight="650" letter-spacing="-1.5">Evangel Yoshiya G. Aranas</text>
      <text x="2" y="132" fill="#8C959F" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="21" letter-spacing="0.4">learner  /  builder  /  developer</text>
      <rect x="1" y="165" width="46" height="3" rx="1.5" fill="#58A6FF"/>
      <rect x="54" y="165" width="15" height="3" rx="1.5" fill="#7EE787" opacity="0.9"/>
    </g>

    <g transform="translate(1000 214)">
      <text x="0" y="0" fill="#F0F6FC" opacity="0.86" font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="36" letter-spacing="8">夜の光</text>
      <text x="2" y="29" fill="#8C959F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="2.4">LIGHT IN THE NIGHT</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" stroke="#30363D"/>
  </g>
</svg>
